   ======================================== */

  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);

  box-shadow:

    inset 0 0 30px rgba(0, 0, 0, 0.5);
  position: relative;
  overflow: hidden;
}

/* Corner decorations */
.slot-machine-frame::before,
.slot-machine-frame::after {
  content: '✦';
  position: absolute;
  font-size: 24px;
  color: #FFD700;
  text-shadow: 0 0 20px #FFD700;

  25% { transform: translateX(-2px) rotate(-0.5deg); }
  75% { transform: translateX(2px) rotate(0.5deg); }

  height: 56px;
  background: rgba(0, 0, 0, 0.4);
  border-radius: 28px;
  overflow: hidden;
  border: 3px solid rgba(255, 255, 255, 0.2);
  touch-action: none;
}

.hatch-target {
  position: absolute;
  top: 0;
  height: 100%;
  background: linear-gradient(90deg,
    rgba(255, 215, 0, 0.4),
    rgba(255, 215, 0, 0.6)
  );
  border-radius: 8px;
  transition: opacity 0.2s ease;
}

.hatch-target.active {
  background: linear-gradient(90deg,
    rgba(152, 251, 152, 0.5),
    rgba(152, 251, 152, 0.7)
  );
}

.hatch-point {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 28px;
  height: 28px;
  background: #ff6b6b;
  border-radius: 50%;
  box-shadow: 0 0 15px rgba(255, 107, 107, 0.6);
  transition: all 0.1s ease;
}

.hatch-point.inside {
  background: #FFD700;
  box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
  width: 32px;
  height: 32px;
}

/* Timer Section - Separate Bar */
.hatch-timer-section {
  width: 100%;
  max-width: 400px;
  margin-top: 8px;
}

.hatch-timer-container {
  display: flex;
  align-items: center;
  gap: 12px;
}

.hatch-timer-icon {
  font-size: 1.2rem;
}

.hatch-timer-bar-bg {
  flex: 1;
  height: 16px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.15);
}

.hatch-timer-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #87CEEB, #FFD700);
  border-radius: 6px;
  transition: width 0.1s linear;
}

.hatch-timer-text {
  font-family: 'Press Start 2P', cursive;
  font-size: 0.6rem;
  color: rgba(255, 255, 255, 0.6);
  min-width: 50px;
  text-align: right;
}

/* Egg - Bottom */
.hatch-egg-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.hatch-egg {
  font-size: 6rem;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
  transition: transform 0.15s ease, filter 0.15s ease;
}

.hatch-egg:active {
  transform: scale(0.92);
}

.hatch-egg.holding {
  filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.7));
  animation: eggPulse 0.5s ease-in-out infinite;
}

@keyframes eggPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.hatch-hold-hint {
  font-family: 'Press Start 2P', cursive;
  font-size: 0.65rem;
  color: rgba(255, 255, 255, 0.5);
  text-align: center;
}

.hatch-hold-hint.active {
  color: #FFD700;
}

/* Celebration */
.hatch-celebration {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  position: relative;
}

.hatch-flash {
  position: fixed;
  inset: 0;
  background: white;
  pointer-events: none;
  z-index: 100;
}

.hatch-pet-appearing {
  font-size: 6rem;
  z-index: 20;
  filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.6));
}

.hatch-celebration h1 {
  font-family: 'Press Start 2P', cursive;
  font-size: 1rem;
  color: #FFD700;
  margin-top: 16px;
  text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
  z-index: 20;
}

.hatch-burst-particle {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  pointer-events: none;
}

/* Particles */
.hatch-particle {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  pointer-events: none;
}

/* Responsive */
@media (max-height: 700px) {
  .hatch-egg {
    font-size: 4.5rem;
  }

  .hatch-intro .intro-egg {
    font-size: 4rem;
  }

  .hatch-bar {
    height: 48px;
  }

  .hatch-point {
    width: 24px;
    height: 24px;
  }

  .hatch-point.inside {
    width: 28px;
    height: 28px;
  }
}

@media (max-width: 360px) {
  .hatch-progress-bar {
    height: 20px;
  }

  .hatch-bar {
    height: 48px;
    border-radius: 24px;
  }

  .hatch-point {
    width: 22px;
    height: 22px;
  }

  .hatch-egg {
    font-size: 5rem;
  }
}
